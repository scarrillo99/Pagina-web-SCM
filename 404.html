<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página no encontrada — SCM Group</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07090a" />
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <style>
      body {
        background: #07090a;
        color: #f2f5f4;
        font-family: 'Inter', system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100svh;
        text-align: center;
      }

      .code {
        font-family: 'Archivo', sans-serif;
        font-weight: 800;
        font-size: clamp(5rem, 22vw, 12rem);
        line-height: 0.85;
        letter-spacing: -0.05em;
        color: #c6f24e;
      }

      h1 {
        font-family: 'Archivo', sans-serif;
        font-weight: 500;
        font-size: clamp(1.2rem, 3vw, 1.8rem);
        margin-block: 1.5rem 0.75rem;
      }

      p {
        color: #93a0a4;
        margin-bottom: 2.5rem;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }

      .links a {
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        padding: 0.9rem 1.6rem;
        font-size: 0.74rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition: border-color 0.3s, color 0.3s;
      }

      .links a:hover {
        border-color: #c6f24e;
        color: #c6f24e;
      }
    </style>
  </head>

  <body>
    <main class="container container--narrow">
      <p class="code">404</p>
      <h1>Esta página no existe</h1>
      <p>Puede que el enlace esté mal escrito o que hayamos movido el contenido.</p>
      <nav class="links">
        <a href="/">Portada</a>
        <a href="/scm/">SCM Sports Agency</a>
        <a href="/magno/">Magno Marbella</a>
      </nav>
    </main>
  </body>
</html>
